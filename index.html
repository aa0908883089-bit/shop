<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>選品相簿</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans TC","PingFang TC",sans-serif;background:#0e0e10;color:#f2f2f7}
img{display:block;max-width:100%}
.top{position:sticky;top:0;z-index:40;background:rgba(14,14,16,.92);border-bottom:1px solid #26262b;padding:12px 14px;display:flex;gap:10px}
.top h1{font-size:15px;font-weight:800}
.search{flex:1;height:36px;border-radius:9px;border:1px solid #2f2f36;background:#1a1a1f;color:#fff;padding:0 12px;font-size:13px;outline:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid #26262b}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:#1a1a1f;border:1px solid #2f2f36;font-size:12.5px;color:#c7c7cf;white-space:nowrap}
.chip.on{background:#c9a227;border-color:#c9a227;color:#141416;font-weight:800}
.hero{padding:22px 16px 18px;border-bottom:1px solid #26262b}
.hero p{font-size:12.5px;line-height:2;color:#9a9aa2}
.hero b{color:#c9a227}
.grid{columns:2;column-gap:8px;padding:10px 8px 90px}
@media(min-width:620px){.grid{columns:3}}
@media(min-width:920px){.grid{columns:4;max-width:1200px;margin:0 auto}}
.card{break-inside:avoid;margin-bottom:8px;border-radius:10px;overflow:hidden;background:#1a1a1f;position:relative}
.card img{width:100%}
.card .wm{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:9.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.card .t{padding:7px 8px 9px;font-size:11.5px;line-height:1.45;color:#c7c7cf;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line{position:fixed;right:14px;bottom:16px;z-index:60;background:#06c755;color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(6,199,85,.4)}
#lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:14px}
#lb.on{display:flex}
#lb img{max-height:76vh;object-fit:contain;border-radius:8px}
#lb .cap{font-size:13px;color:#c7c7cf;text-align:center}
#lb .x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:0;font-size:20px}
.empty{padding:60px 0;text-align:center;color:#6e6e78;font-size:13px}
</style>
</head>
<body>
<div class="top"><h1>選品相簿</h1><input class="search" id="q" placeholder="搜尋：LV、Nike、外套、鞋"></div>
<div class="chips" id="chips"></div>
<div class="hero"><p>全場<b>一件起批</b>，支援貨到付款<br>喜歡的直接截圖問我<br><b>Line @661nfaov</b>　7-11</p></div>
<div class="grid" id="g"></div>
<a class="line" href="https://line.me/R/ti/p/@661nfaov">💬 截圖問我</a>
<div id="lb"><button class="x" onclick="lb.classList.remove('on')">✕</button><img id="lbi"><div class="cap" id="lbc"></div></div>
<script>
const CDN="https://xcimg.szwego.com/";
const u=p=>CDN+p+"?imageMogr2/auto-orient/thumbnail/!700x700r/quality/82/format/jpg";
const g=document.getElementById("g"),lb=document.getElementById("lb");
let ALL=[],cat="全部";
fetch("data.json").then(r=>r.json()).then(d=>{
  ALL=d;
  const cats=[...new Set(d.map(x=>x.c).filter(Boolean))];
  if(cats.length>1){
    const box=document.getElementById("chips");
    ["全部",...cats].forEach(n=>{
      const b=document.createElement("div");
      b.className="chip"+(n==="全部"?" on":"");b.textContent=n;
      b.onclick=()=>{cat=n;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");render(document.getElementById("q").value)};
      box.appendChild(b);
    });
  }
  render("");
}).catch(()=>{g.innerHTML='<div class="empty">資料載入失敗</div>'});
function render(kw){
  g.innerHTML="";
  const L=ALL.filter(x=>(cat==="全部"||x.c===cat)&&(!kw||x.t.toLowerCase().includes(kw.toLowerCase())));
  if(!L.length){g.innerHTML='<div class="empty">沒有符合的商品</div>';return}
  L.forEach(x=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<img loading="lazy" src="${u(x.i)}"><div class="wm">@661nfaov</div><div class="t">${x.t}</div>`;
    c.onclick=()=>{document.getElementById("lbi").src=u(x.i);document.getElementById("lbc").textContent=x.t;lb.classList.add("on")};
    g.appendChild(c);
  });
}
document.getElementById("q").oninput=e=>render(e.target.value);
lb.onclick=e=>{if(e.target.id==="lb")lb.classList.remove("on")};
</script>
</body>
</html>
